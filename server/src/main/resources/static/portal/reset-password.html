<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VaultDesk — Reset Password</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="login-bg">
    <div class="login-card">
        <div class="login-title">Reset Password</div>
        <div class="login-subtitle">Choose a new password below.</div>

        <label>New Password</label>
        <input type="password" id="newPwd" placeholder="Minimum 6 characters">

        <label>Confirm New Password</label>
        <input type="password" id="confirmPwd" placeholder="Re-enter new password">

        <div id="successAnim" class="hidden" style="text-align:center; margin: 12px 0;">
            <div class="spinner"></div>
        </div>
        <div class="error-text" id="statusMsg"></div>

        <button class="btn-primary btn-block" id="resetBtn">Reset Password</button>
    </div>
</div>
<script src="js/api.js"></script>
<script src="js/reset-password.js"></script>
</body>
</html>
