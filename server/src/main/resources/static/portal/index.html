<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VaultDesk Employee</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="interactive-bg">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
</div>
<div class="app-shell">
    <div class="sidebar glass-panel">
        <div class="sidebar-header">
            <div class="sidebar-title">VaultDesk</div>
            <div class="sidebar-sub">Employee Portal</div>
        </div>
        <div class="sidebar-user">
            <b id="sbName"></b>
            <span id="sbDesig"></span>
        </div>
        <button class="nav-btn active" data-view="home">⊞ Dashboard</button>
        <button class="nav-btn" data-view="tickets">✉ My Tickets</button>
        <button class="nav-btn" data-view="raise">＋ Raise Ticket</button>
        <button class="nav-btn" data-view="pending">✔ Pending Approval</button>
        <button class="nav-btn" data-view="assets">▣ My Assets</button>
        <div class="nav-spacer"></div>
        <button class="nav-btn" data-view="settings">⚙ Settings</button>
        <button class="nav-btn" id="logoutBtn">→ Logout</button>
    </div>
    <div class="main">
        <div class="topbar glass-panel" style="padding: 10px 20px;">
            <div class="bell" id="bellIcon">🔔<span class="badge-count hidden" id="bellCount">0</span></div>
        </div>
        <div id="notifDropdown" class="notif-dropdown glass-panel hidden"></div>
        <div id="content"></div>
    </div>
</div>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
